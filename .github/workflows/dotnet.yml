name: .NET Desktop

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: TeraFinder.sln

    steps:
      - name: Checkout TeraFinder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/TeraFinder.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Checkout PKHeX
        uses: actions/checkout@v4
        with:
          repository: kwsch/PKHeX
          ref: master
          path: PKHeX

      - name: Build PKHeX.Core
        shell: pwsh
        run: |
          Set-Location "PKHeX/PKHeX.Core"
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: List PKHeX.Core build output
        shell: pwsh
        run: |
          $ReleasePath = Join-Path $env:GITHUB_WORKSPACE "PKHeX/PKHeX.Core/bin/Release"

          if (-not (Test-Path $ReleasePath)) {
            throw "PKHeX.Core Release output folder was not found: $ReleasePath"
          }

          Get-ChildItem -Path $ReleasePath -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Restore TeraFinder NuGet packages
        shell: pwsh
        run: dotnet restore $env:Solution_Name

      - name: Replace PKHeX.Core NuGet DLL
        shell: pwsh
        run: |
          $PackageBaseFolder = Join-Path $env:USERPROFILE ".nuget/packages/pkhex.core"

          if (-not (Test-Path $PackageBaseFolder)) {
            throw "PKHeX.Core NuGet package folder was not found: $PackageBaseFolder"
          }

          $LatestVersionFolder = Get-ChildItem -Path $PackageBaseFolder -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $LatestVersionFolder) {
            throw "No installed PKHeX.Core NuGet package version folder was found."
          }

          $PkhexBuildOutput = Join-Path $env:GITHUB_WORKSPACE "PKHeX/PKHeX.Core/bin/Release"

          $PkhexCoreDllSource = Get-ChildItem `
            -Path $PkhexBuildOutput `
            -Filter "PKHeX.Core.dll" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $PkhexCoreDllSource) {
            throw "Could not find freshly built PKHeX.Core.dll under: $PkhexBuildOutput"
          }

          $NuGetLibFolder = Join-Path $LatestVersionFolder.FullName "lib"

          if (-not (Test-Path $NuGetLibFolder)) {
            throw "Installed PKHeX.Core package lib folder was not found: $NuGetLibFolder"
          }

          $NuGetDllDestinations = Get-ChildItem `
            -Path $NuGetLibFolder `
            -Filter "PKHeX.Core.dll" `
            -File `
            -Recurse

          if (-not $NuGetDllDestinations) {
            throw "Could not find PKHeX.Core.dll under the installed NuGet package: $NuGetLibFolder"
          }

          Write-Host "Source DLL: $($PkhexCoreDllSource.FullName)"
          Write-Host "NuGet version: $($LatestVersionFolder.Name)"

          foreach ($DestinationDll in $NuGetDllDestinations) {
            Write-Host "Replacing: $($DestinationDll.FullName)"

            Copy-Item `
              -Path $PkhexCoreDllSource.FullName `
              -Destination $DestinationDll.FullName `
              -Force
          }

      - name: Build TeraFinder
        shell: pwsh
        run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

      - name: Execute unit tests
        shell: pwsh
        run: dotnet test $env:Solution_Name --configuration ${{ matrix.configuration }} --no-build

      # Optional: Enable code coverage.
      # - name: Execute unit tests with coverage
      #   shell: pwsh
      #   run: dotnet test $env:Solution_Name --configuration ${{ matrix.configuration }} --no-build --collect:"XPlat Code Coverage" --logger:"trx;LogFileName=test-results.trx"
      #
      # - name: Install ReportGenerator
      #   shell: pwsh
      #   run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.8
      #
      # - name: Analyze code coverage
      #   shell: pwsh
      #   run: $env:USERPROFILE\.dotnet\tools\reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:"HtmlInline"
      #
      # - name: Upload coverage report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: code-coverage-report
      #     path: coverage

      - name: Upload Launcher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeraFinder.Launcher
          path: TeraFinder.Launcher/bin
          if-no-files-found: error

      - name: Upload Plugins artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeraFinder.Plugins
          path: |
            TeraFinder.Plugins/bin
            !TeraFinder.Plugins/bin/Release/net9.0-windows7.0/PKHeX.Core.dll
            !TeraFinder.Plugins/bin/Release/net9.0-windows7.0/PKHeX.Drawing.dll
            !TeraFinder.Plugins/bin/Release/net9.0-windows7.0/PKHeX.Drawing.PokeSprite.dll
          if-no-files-found: error
